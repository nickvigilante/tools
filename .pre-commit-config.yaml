# Pre-commit hooks for the tools repo. Formats files and scans for secrets
# before each commit; the same hooks run in CI (.github/workflows/lint.yml's
# pre-commit job) via `pre-commit run --all-files`, so local and CI can't drift.
#
# One-time local setup:
#   brew install pre-commit shfmt shellcheck betterleaks
#   pre-commit install
#
# Formatter/linter per file type:
#   Markdown  -> mdformat (+ mdformat-tables; CommonMark-strict, won't mangle
#                snake_case prose or rewrite embedded code blocks)
#   Python    -> ruff (format + lint)
#   Shell     -> shfmt (format) + shellcheck (lint, -S info)
#   Secrets   -> betterleaks
#   All files -> whitespace / EOF / merge-conflict hygiene

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--wrap, keep, --number]
        additional_dependencies:
          - mdformat-tables

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Other formatters/linters run from the locally installed binaries
  # (language: system), matching what CI installs.
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (format shell)
        entry: shfmt -w -i 2 -ci -bn
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck (-S info)
        entry: shellcheck -S info
        language: system
        types: [shell]

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.3.1
    hooks:
      - id: betterleaks
